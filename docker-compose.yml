services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: forma
      POSTGRES_PASSWORD: forma_dev_only
      POSTGRES_DB: forma
    ports:
      - "55434:5432"
    volumes:
      - forma_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forma -d forma"]
      interval: 5s
      retries: 10
volumes:
  forma_pgdata:
