# Documentation remains in docs/ and is reviewed in GitHub.
# Forma Pages is the single owner of this repository's GitHub Pages site.
# This workflow validates docs without publishing a second Pages artifact.
name: Docs
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yaml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate documentation files
        run: |
          test -s docs/index.md
          find docs -type f -name "*.md" -print | sort
